name: Latido

# Mantiene activo el proyecto gratuito de Supabase con una consulta diaria mínima.
on:
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Consultar la base de datos
        run: |
          set -euo pipefail
          # Valores públicos (los mismos de .env.production); la clave publicable no es secreta.
          URL="https://zhyyaglmjvyxdfoagwfp.supabase.co"
          KEY="sb_publishable_FlNoNguJQ3Dh71wUTqMwew_eOyIc6W8"
          code=$(curl -s -o /tmp/r -w '%{http_code}' -X POST "$URL/rest/v1/rpc/ping" \
            -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}')
          cat /tmp/r; echo
          test "$code" = "200"
