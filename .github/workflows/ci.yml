name: Revisión

on:
  push:
    branches: [main]
  pull_request:

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tipos
        run: npm run typecheck
      - name: Estilo de código
        run: npm run lint
      - name: Pruebas
        run: npm test
      - name: Compilación
        run: npx vite build
